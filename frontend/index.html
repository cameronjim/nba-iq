<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="NBA stats, nightly stat projections, and a fantasy roster tool." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NBA IQ</title>
    <script>
      // mirrors THEMES in src/hooks/useTheme.ts so the first paint uses the saved theme.
      (function () {
        var themes = ['paper', 'contrast', 'night'];
        var stored = localStorage.getItem('theme');
        var theme = themes.indexOf(stored) !== -1
          ? stored
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'paper');
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
