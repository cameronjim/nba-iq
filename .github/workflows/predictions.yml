# Daily prediction publishing.
#
# THIS WRITES TO PRODUCTION. `secrets.DATABASE_URL` is the prod Neon branch, and a
# successful run inserts one `prediction_runs` row plus ~62 `player_game_predictions`
# rows per player-game into it. The store is append-only (MODEL.md 13.8.3): a bad run
# is superseded by a later one, never edited, so there is nothing to undo. Test
# changes with `workflow_dispatch` and `dry_run: true` first - that path reads the
# same database, scores the same slate, and writes nothing.
#
# AN OFFSEASON NO-OP IS THE EXPECTED RESULT UNTIL PRESEASON. `daily_run.py` exits 0
# having written nothing when no game falls in its 7-day extended window, which is
# every day between the finals and the first preseason game. A green run that says "no
# games in window" is the correct outcome, not a misconfiguration. Once preseason
# starts it publishes an extended NOT PROSPECTIVE run (all games, next 7 days) after
# the frozen prospective run, which is skipped until the first Regular Season game is
# inside its 2-day window (MODEL.md 16.7).
#
# A RED RUN IS THE ALERT. There is no retry and no notification wiring: the driver
# exits non-zero naming the phase that failed, and the failed-workflow email is the
# signal. A missed slate is recorded and never backfilled (13.8.2), so re-running this
# after tipoff will correctly refuse to publish those games. A red morning run can
# still be re-dispatched manually before the afternoon's first tip and publish the
# whole slate at a valid gameday offset.
#
# THE RESCORE LANE. A second cron mirrors scraper.yml's injuries-only lane 15 minutes
# later, so the fresh CBS/official rows exist when it reads them. It runs
# `daily_run.py --if-status-changed`: when no player on a team with an untipped game in
# the 7-day window changed designation class (available / questionable / out) since
# the newest production run's information boundary, it exits 0 having written
# nothing; otherwise it publishes a normal run (A if it qualifies, then B) whose notes
# carry `rescore=status_change; changed_players=N` and whose registry entries carry
# `trigger: status_change`. The 16:00 lane is unchanged. See MODEL.md 20.3.
#
# Python 3.14, not the 3.12 the scraper uses. See the header of ml/requirements.txt:
# this job unpickles the frozen scikit-learn 1.9.0 serving artifact, and 3.12 cannot
# install scikit-learn 1.9.0.
name: NBA Predictions

on:
  schedule:
    # 16:00 UTC = noon EDT / 11am EST. Every tip from 3pm through 10:30pm ET is
    # 3-11.5 hours out at that instant, so the WHOLE slate - afternoon games
    # included - is served inside the `gameday` horizon bucket of (2, 12] hours
    # before tipoff that section 13.8.1 commits to serving at. The original
    # 21:00 UTC schedule bought fresher afternoon injury news for evening games
    # at the price of never publishing a 3pm tip at all (already past tip at
    # 5pm ET, so daily_run.py dropped it); moved 2026-08-24 to close that gap.
    # See MODEL.md 16.3 for the tradeoff. Rare noon/1pm ET holiday tips land in
    # the `lock` bucket (0, 2] - published before tip, recorded off-gameday.
    - cron: "0 16 * * *"
    # the rescore lane: scraper.yml's injuries-only lane ("30 15,19-02") plus 15 min.
    - cron: "45 15,19,20,21,22,23,0,1,2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Score the slate but write nothing to the database"
        type: boolean
        default: false

# one publisher at a time. The store is append-only, so two overlapping runs would
# not corrupt anything - they would both succeed and the slate would carry two runs
# for the same information boundary, which makes every per-slate aggregate ambiguous.
# `cancel-in-progress: false`: the run already underway is the one holding the earlier
# (and therefore correct) boundary, so a manual dispatch waits instead of killing it.
concurrency:
  group: predictions
  cancel-in-progress: false

jobs:
  predict:
    name: Publish daily predictions
    runs-on: ubuntu-latest
    # the dataset rebuild fits one LightGBM base-availability model per calendar block
    # over four seasons, then builds features once per game date in the 7-day extended
    # window. That is the slow part and it runs in minutes; 45 is generous headroom
    # without letting a hang burn the 6-hour GitHub default (see ci.yml, which grew
    # timeouts on 2026-08-18 after a stalled step sat "in progress" for hours).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install dependencies
        run: pip install -r ml/requirements.txt

      # --shadow-feature-set v1 adds the 13.4 rung (c) shadow run (channel 'shadow',
      # never served). until ml/models/20260818-v1/ is committed it is skipped with
      # a warning and the served runs are unchanged.
      #
      # github.event.schedule carries the cron expression that fired. each pattern
      # below must match its cron line above character for character; an unknown
      # schedule fails the run rather than silently falling through to a publish.
      # a manual dispatch has an empty schedule and runs the scheduled lane.
      - name: Run daily predictions
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SCHEDULE: ${{ github.event.schedule }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          case "$SCHEDULE" in
            "0 16 * * *" | "")
              python ml/daily_run.py --shadow-feature-set v1 $DRY_RUN ;;
            "45 15,19,20,21,22,23,0,1,2 * * *")
              python ml/daily_run.py --if-status-changed --shadow-feature-set v1 $DRY_RUN ;;
            *) echo "unknown schedule '$SCHEDULE'" >&2; exit 1 ;;
          esac
