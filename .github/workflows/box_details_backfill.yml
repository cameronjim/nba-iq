name: Box Details Backfill

# manual only: one bounded, resumable slice per run, read from the www.nba.com
# box-score pages, which answer from runners where stats.nba.com does not.
# re-dispatch until the log reports nothing to do for the season.
# mode box-details fills started/position/oreb/dreb/pf/dnp_reason on logged
# games; mode game-logs fills whole games with no logs (preseason, postseason,
# or any game the league-wide log missed).
on:
  workflow_dispatch:
    inputs:
      season:
        description: "season to backfill, e.g. 2024-25"
        required: true
        type: string
      mode:
        description: "box-details or game-logs"
        required: true
        default: box-details
        type: choice
        options:
          - box-details
          - game-logs
      limit:
        description: "max games this run (about 600 fit in 35 minutes at a 2s delay)"
        required: false
        default: "600"
        type: string

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Backfill from nba.com box-score pages
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SEASON: ${{ inputs.season }}
          MODE: ${{ inputs.mode }}
          LIMIT: ${{ inputs.limit }}
        run: |
          if [ "$MODE" = "game-logs" ]; then
            task="--backfill-game-logs"
          else
            task="--backfill-box-details"
          fi
          python scraper/run_scraper.py "$task" --source web --season "$SEASON" --limit "$LIMIT"
