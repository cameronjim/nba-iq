name: NBA Scraper

on:
  schedule:
    # the full scrape, every 6 hours.
    - cron: "0 */6 * * *"
    # injuries only. 15:30 lands 30 minutes before the 16:00 predictions run,
    # so the model publishes against the freshest designations a scrape can
    # give it; 19:00-03:00 hourly covers 3pm ET afternoon tips through the last
    # west-coast pregame in both halves of the DST year, keeping the slate
    # page's CURRENT-status overlay near game-time fresh. One CBS page fetch,
    # no nba_api calls. offset to :30 so the 00:00/18:00 full scrapes never
    # overlap this lane.
    - cron: "30 15,19,20,21,22,23,0,1,2 * * *"
    # odds snapshot only, every 30 minutes 15:00-03:30 utc, so the odds history
    # brackets every tip-off. espn requests only, no nba_api calls; with
    # ODDS_API_KEY set it also snapshots player props, at most once per 20
    # hours to stay inside the odds api's monthly quota. a slot shared
    # with another lane runs as its own workflow and only adds a snapshot.
    - cron: "*/30 15-23,0-3 * * *"
    # game logs only, from the nba.com box-score pages, once every west-coast
    # game has finished in both halves of the DST year. new logs, team logs,
    # status rows, box details and the stint sync for the current season,
    # capped per run; the full scrape runs the same steps when stats.nba.com
    # is unreachable, so a missed night catches up within 6 hours.
    - cron: "0 9 * * *"
  workflow_dispatch:          # also allows manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    # the full scrape takes about 15 minutes; the injuries-only lane takes
    # seconds and the game-logs lane a few minutes. either way a hang must not
    # burn the 6-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      # github.event.schedule carries the cron expression that fired, which is
      # how one workflow runs four cadences. each pattern below must match its
      # cron line above character for character; an unknown schedule fails the
      # run rather than silently falling through to the full scrape.
      # a manual dispatch has an empty schedule and runs the full scrape.
      - name: Run scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # optional: the odds lane snapshots player props only when it is set.
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          case "$SCHEDULE" in
            "0 */6 * * *" | "") flag="" ;;
            "30 15,19,20,21,22,23,0,1,2 * * *") flag="--injuries-only" ;;
            "*/30 15-23,0-3 * * *") flag="--odds-only" ;;
            "0 9 * * *") flag="--game-logs-web" ;;
            *) echo "unknown schedule '$SCHEDULE'" >&2; exit 1 ;;
          esac
          python scraper/run_scraper.py $flag
