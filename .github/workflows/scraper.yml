name: NBA Scraper

on:
  schedule:
    # the full scrape, every 6 hours.
    - cron: "0 */6 * * *"
    # injuries only. 15:30 lands 30 minutes before the 16:00 predictions run,
    # so the model publishes against the freshest designations a scrape can
    # give it; 19:00-03:00 hourly covers 3pm ET afternoon tips through the last
    # west-coast pregame in both halves of the DST year, keeping the slate
    # page's CURRENT-status overlay near game-time fresh. One CBS page fetch,
    # no nba_api calls. offset to :30 so the 00:00/18:00 full scrapes never
    # overlap this lane.
    - cron: "30 15,19,20,21,22,23,0,1,2 * * *"
    # odds snapshot only, every 30 minutes 15:00-03:30 utc, so the odds history
    # brackets every tip-off. one espn request, no nba_api calls. a slot shared
    # with another lane runs as its own workflow and only adds a snapshot.
    - cron: "*/30 15-23,0-3 * * *"
  workflow_dispatch:          # also allows manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    # the full scrape takes about 15 minutes; the injuries-only lane takes
    # seconds. either way a hang must not burn the 6-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      # github.event.schedule carries the cron expression that fired, which is
      # how one workflow runs three cadences. each pattern below must match its
      # cron line above character for character; an unknown schedule fails the
      # run rather than silently falling through to the full scrape.
      # a manual dispatch has an empty schedule and runs the full scrape.
      - name: Run scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          case "$SCHEDULE" in
            "0 */6 * * *" | "") flag="" ;;
            "30 15,19,20,21,22,23,0,1,2 * * *") flag="--injuries-only" ;;
            "*/30 15-23,0-3 * * *") flag="--odds-only" ;;
            *) echo "unknown schedule '$SCHEDULE'" >&2; exit 1 ;;
          esac
          python scraper/run_scraper.py $flag
