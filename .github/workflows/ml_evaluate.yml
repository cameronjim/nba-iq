# Manual ML evaluation against a live database: rebuild the dataset, run the
# rolling-origin evaluation, and score published runs. Reads the database
# only; nothing here writes to it. Reports are uploaded as artifacts; the
# parquet datasets are not (size).
#
# Python 3.14 for the same reason as predictions.yml: ml/requirements.txt pins
# a scikit-learn that 3.12 cannot install.
name: ML Evaluate

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Database to read"
        type: choice
        options:
          - dev
          - prod
        default: dev
      build_dataset:
        description: "Rebuild ml/data/*.parquet from postgres"
        type: boolean
        default: true
      evaluate:
        description: "Run evaluate.py (fails the job on a composition regression)"
        type: boolean
        default: false
      score_runs:
        description: "Score published prediction runs"
        type: boolean
        default: true
      score_since:
        description: "score_runs --since date, YYYY-MM-DD (empty = the tool's default)"
        type: string
        required: false
        default: ""
      version:
        description: "evaluate.py --version"
        type: string
        default: "20260818"

concurrency:
  group: ml-evaluate
  cancel-in-progress: false

jobs:
  evaluate:
    name: ML evaluate (${{ inputs.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ inputs.target == 'prod' && secrets.DATABASE_URL || secrets.DEV_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install dependencies
        run: pip install -r ml/requirements.txt

      - name: Dev target warning
        if: inputs.target == 'dev'
        run: |
          echo "::warning title=Dev database::The dev Neon branch holds only two seasons. Evaluation numbers from this run are NOT comparable to MODEL.md (see MODEL.md 16.6)."

      - name: Build dataset
        if: inputs.build_dataset
        run: python ml/build_dataset.py --source postgres

      # exit 1 is a real gate (ml/README.md): the promoted composition regressed
      # more than 1% MAE against the one it replaced.
      - name: Evaluate
        if: inputs.evaluate
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set +e
          python ml/evaluate.py --version "$VERSION"
          status=$?
          if [ "$status" -eq 1 ]; then
            echo "::error title=Composition regression::evaluate.py exited 1: the promoted composition lost more than 1% MAE against the one it replaced. See ml/reports/$VERSION.md in the artifact."
          fi
          exit "$status"

      - name: Score runs
        if: inputs.score_runs && !cancelled()
        env:
          SINCE: ${{ inputs.score_since }}
        run: |
          python ml/score_runs.py ${SINCE:+--since "$SINCE"} --out-dir ml/reports/scoring

      - name: Upload scoring reports
        if: always() && inputs.score_runs
        uses: actions/upload-artifact@v4
        with:
          name: ml-scoring-${{ inputs.target }}-${{ github.run_id }}
          path: ml/reports/scoring/**
          if-no-files-found: ignore
          retention-days: 30

      # gated on the input: ml/reports/ also holds committed reports, and an
      # unrun evaluation must not upload the checked-in copy as if it were fresh.
      - name: Upload evaluation report
        if: always() && inputs.evaluate
        uses: actions/upload-artifact@v4
        with:
          name: ml-evaluate-${{ inputs.target }}-${{ github.run_id }}
          path: ml/reports/${{ inputs.version }}.md
          if-no-files-found: warn
          retention-days: 30
