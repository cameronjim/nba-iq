service: fantasy-nba-api

# pin to serverless framework v3. v4 requires a serverless.com account
# and access key; v3 stays free for personal use and is feature-complete
# for this app. if v3 ever stops working, switch to v4 + license key.
frameworkVersion: '3'

provider:
  name: aws
  # nodejs20.x is the highest runtime serverless framework v3 supports.
  # the runtime is independent of the runner's node version — lambda uses
  # whatever runtime is declared here, not whatever ci built with.
  runtime: nodejs20.x
  region: us-east-1
  timeout: 30
  environment:
    DATABASE_URL: ${env:DATABASE_URL}
    ANTHROPIC_API_KEY: ${env:ANTHROPIC_API_KEY}
    AI_PROVIDER: ${env:AI_PROVIDER, ''}
    AI_MODEL: ${env:AI_MODEL, ''}
    AI_BASE_URL: ${env:AI_BASE_URL, ''}
    AI_API_KEY: ${env:AI_API_KEY, ''}
    FRONTEND_URL: ${env:FRONTEND_URL, ''}
    FROM_EMAIL: ${env:FROM_EMAIL, ''}
    GOOGLE_CLIENT_ID: ${env:GOOGLE_CLIENT_ID, ''}
    AUTH_SECRET: ${env:AUTH_SECRET}
    BASELINE_INCLUDES_POSTSEASON: ${env:BASELINE_INCLUDES_POSTSEASON, ''}
    NODE_ENV: production
  iam:
    role:
      statements:
        # Allow Lambda to send password-reset emails through SES.
        - Effect: Allow
          Action:
            - ses:SendEmail
          Resource: '*'

functions:
  api:
    handler: dist/lambda.handler
    events:
      - httpApi:
          path: /{proxy+}
          method: any
      - httpApi:
          path: /
          method: any
  propJobs:
    handler: dist/jobs/propJobs.handler
    timeout: 120
    events:
      - schedule:
          rate: rate(30 minutes)
          enabled: true

package:
  patterns:
    - '!src/**'
    - '!*.ts'
    - '!tsconfig.json'
    - '!.env'
    - 'dist/**'
    - 'node_modules/**'
